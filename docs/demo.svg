  <text x="855" y="168" font-size="9" fill="#DBEAFE" text-anchor="middle">code · PR</text>

  <!-- decision context store -->
  <path d="M350 250 h160 a4 4 0 0 1 4 4 v52 a4 4 0 0 1 -4 4 h-160 a4 4 0 0 1 -4 -4 v-52 a4 4 0 0 1 4 -4 z" fill="#334155"/>
  <ellipse cx="430" cy="250" rx="84" ry="14" fill="#475569"/>
  <text x="430" y="296" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Decision Context Store</text>
  <text x="430" y="196" font-size="10" fill="#64748B" text-anchor="middle">spec · architecture · decisions</text>
  <path d="M430 236 v-24" stroke="#94A3B8" stroke-width="2"/>
