  <text x="555" y="150" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Build</text>
  <text x="555" y="168" font-size="9" fill="#DBEAFE" text-anchor="middle">dev agent</text>

  <path d="M610 152 h32" stroke="#94A3B8" stroke-width="2"/>
  <path d="M642 152 l-7 -4 v8 z" fill="#94A3B8"/>

  <rect x="650" y="120" width="110" height="64" rx="12" fill="#F59E0B"/>
  <text x="705" y="150" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Verify</text>
  <text x="705" y="168" font-size="9" fill="#FEF3C7" text-anchor="middle">test agent</text>

